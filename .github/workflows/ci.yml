name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build app (universal)
        run: ./build.sh

      - name: Check the bundle
        run: |
          test -x build/MDReader.app/Contents/MacOS/MDReader
          test -x build/MDReader.app/Contents/Resources/mdr
          test -f build/MDReader.app/Contents/Resources/web/index.html
          lipo -archs build/MDReader.app/Contents/MacOS/MDReader | grep -q x86_64
          codesign --verify --deep --strict build/MDReader.app

  renderer-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci
        working-directory: tests
      - run: npm test
        working-directory: tests
