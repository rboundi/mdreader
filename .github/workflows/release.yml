name: Release

# Push a tag like v1.2.0 to build a universal MDReader.app, publish it as a GitHub release,
# and (optionally) bump the Homebrew cask in your tap.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          VERSION="$VERSION" ./build.sh --release
          # Releases must run on both Apple Silicon and Intel.
          lipo -archs build/MDReader.app/Contents/MacOS/MDReader | grep -q x86_64
          echo "SHA256=$(shasum -a 256 "build/MDReader-$VERSION.zip" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "build/MDReader-$VERSION.dmg" "build/MDReader-$VERSION.zip" \
            --title "MDReader $VERSION" \
            --generate-notes \
            --notes "Universal build for macOS 13 or later. Download the .dmg and drag MDReader to Applications.

          The app isn't notarized. The first time, right-click it and choose **Open**, or run \`xattr -dr com.apple.quarantine /Applications/MDReader.app\`."

      # Needs a repo named homebrew-tap and a HOMEBREW_TAP_TOKEN secret (a fine-grained token
      # with Contents: read & write on that repo). Skipped when the secret isn't set.
      - name: Update Homebrew cask
        if: env.TAP_TOKEN != ''
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${GITHUB_REPOSITORY_OWNER}/homebrew-tap.git" tap
          mkdir -p tap/Casks
          sed -e "s/^  version \".*\"/  version \"$VERSION\"/" \
              -e "s/^  sha256 \".*\"/  sha256 \"$SHA256\"/" \
              packaging/homebrew/mdreader.rb > tap/Casks/mdreader.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/mdreader.rb
          git commit -m "mdreader $VERSION"
          git push
