name: Bug report
description: Something renders wrong or doesn't work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect instead? Screenshots help.
    validations:
      required: true
  - type: textarea
    id: markdown
    attributes:
      label: Markdown that reproduces it
      description: The smallest snippet that shows the problem.
      render: markdown
  - type: input
    id: versions
    attributes:
      label: MDReader and macOS versions
      placeholder: MDReader 1.0.0 on macOS 15.3
    validations:
      required: true
